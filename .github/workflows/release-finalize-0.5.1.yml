name: Finalize 0.5.1 Release

on:
  push:
    branches:
      - 'release/0.5.1'

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/release/0.5.1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate 0.5.1 release tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "$version" = "0.5.1"
          git rev-parse --verify refs/tags/v0.5.1 >/dev/null
          tag_target="$(git rev-list -n1 refs/tags/v0.5.1^{commit})"
          test "$tag_target" = "538e6030e2cc807f0ef36a44b2b54c92415a5830"

      - name: Build container image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          docker build --pull -f Containerfile -t "$IMAGE_NAME:v0.5.1" -t "$IMAGE_NAME:latest" .
          docker image inspect "$IMAGE_NAME:v0.5.1" >/dev/null

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push container image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_NAME:v0.5.1"
          docker push "$IMAGE_NAME:latest"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_NAME:v0.5.1")"
          printf '%s\n' "$digest" > container-digest.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v0.5.1 >/dev/null 2>&1; then
            echo 'v0.5.1 release already exists'
            exit 0
          fi
          gh release create v0.5.1 \
            --verify-tag \
            --generate-notes \
            --title 'proxy-agent v0.5.1' \
            container-digest.txt

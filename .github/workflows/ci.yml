name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './bin ./lib ./backends ./adapters ./integrations ./tests'
      - name: ShellCheck installers
        run: shellcheck install.sh install-user.sh upgrade.sh upgrade-user.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize executable permissions
        run: |
          chmod 0755 bin/* install.sh install-user.sh upgrade.sh upgrade-user.sh integrations/*.sh backends/*.sh adapters/*.sh lib/*.sh tests/*.sh
      - name: Syntax check
        run: |
          find bin lib backends adapters integrations tests -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          bash -n install.sh
          bash -n install-user.sh
          bash -n upgrade.sh
          bash -n upgrade-user.sh
      - name: Backend contract smoke
        run: bash tests/backend-contract-smoke.sh
      - name: HTTP CONNECT smoke
        run: bash tests/http-connect-smoke.sh
      - name: Upgrade entrypoint guard smoke
        run: |
          ! ./upgrade.sh >/dev/null 2>&1
          if [[ "$EUID" -ne 0 ]]; then ! ./upgrade-user.sh >/dev/null 2>&1; fi
      - name: Container contract smoke
        run: |
          test -f Containerfile
          grep -q '^FROM debian:bookworm-slim$' Containerfile
          grep -q '^ENTRYPOINT \["/opt/proxy-agent/bin/proxy-ctl"\]$' Containerfile
          grep -q '^CMD \["run"\]$' Containerfile
          grep -q '^USER \$SERVICE_USER$' Containerfile
          grep -q '^HEALTHCHECK ' Containerfile
      - name: systemd unit contract smoke
        run: |
          for unit in systemd/*.service systemd/*.timer systemd-user/*.service systemd-user/*.timer; do
            grep -Eq '^\[(Unit|Service|Timer|Install)\]$' "$unit"
          done
          grep -q '^Type=simple$' systemd/proxy-agent.service
          grep -q '^ExecStart=/bin/bash @PREFIX@/bin/proxy-ctl run$' systemd/proxy-agent.service
          grep -q '^User=@SERVICE_USER@$' systemd/proxy-agent.service
          grep -q '^Group=@SERVICE_GROUP@$' systemd/proxy-agent.service
          grep -q '^NoNewPrivileges=true$' systemd/proxy-agent.service
          grep -q '^ProtectSystem=strict$' systemd/proxy-agent.service
          grep -q '^ProtectHome=read-only$' systemd/proxy-agent.service
          grep -q '^Type=simple$' systemd/proxy-agent@.service
          grep -q '^ExecStart=/bin/bash @PREFIX@/bin/proxy-ctl --profile %i run$' systemd/proxy-agent@.service
          grep -q '^User=@SERVICE_USER@$' systemd/proxy-agent@.service
          grep -q '^User=@SERVICE_USER@$' systemd/proxy-agent-health.service
          grep -q '^User=@SERVICE_USER@$' systemd/proxy-agent-health@.service
          grep -q '^Requires=proxy-agent@%i.service$' systemd/proxy-agent-health@.service
          grep -q '^ExecStart=.*proxy-agent-health --profile %i$' systemd/proxy-agent-health@.service
          grep -q '^Type=simple$' systemd-user/proxy-agent.service
          grep -q '^ExecStart=@BIN@/proxy-ctl run$' systemd-user/proxy-agent.service
          grep -q '^Environment=PA_STATE_DIR=%t/proxy-agent/run$' systemd-user/proxy-agent.service
          grep -q '^Environment=PA_LOG_DIR=%t/proxy-agent/log$' systemd-user/proxy-agent.service
          grep -q '^ProtectHome=read-only$' systemd-user/proxy-agent.service
          grep -q '^ExecStart=@BIN@/proxy-ctl --profile %i run$' systemd-user/proxy-agent@.service
          grep -q '^Environment=PA_STATE_DIR=%t/proxy-agent/run/%i$' systemd-user/proxy-agent@.service
          grep -q '^ExecStart=@BIN@/proxy-agent-health --profile %i$' systemd-user/proxy-agent-health@.service
          grep -q '^Unit=proxy-agent-health@%i.service$' systemd-user/proxy-agent-health@.timer
      - name: Functional smoke suite
        run: bash tests/smoke.sh
      - name: TUI guard smoke
        run: bash tests/tui-smoke.sh
      - name: Chinese localization smoke
        run: bash tests/i18n-smoke.sh
      - name: CLI policy smoke
        run: |
          mkdir -p /tmp/proxy-agent
          cp proxy-agent.conf.example /tmp/proxy-agent/proxy-agent.conf
          chmod 0600 /tmp/proxy-agent/proxy-agent.conf
          PA_CONFIG=/tmp/proxy-agent/proxy-agent.conf bash bin/proxy-ctl diagnose
          PA_CONFIG=/tmp/proxy-agent/proxy-agent.conf bash bin/proxy-ctl route example.com
          PA_CONFIG=/tmp/proxy-agent/proxy-agent.conf bash bin/proxy-ctl route example.cn
          PA_CONFIG=/tmp/proxy-agent/proxy-agent.conf bash bin/proxy-ctl route 10.12.34.56
          PA_CONFIG=/tmp/proxy-agent/proxy-agent.conf bash bin/proxy-agent-integration all
          PA_CONFIG=/tmp/proxy-agent/proxy-agent.conf bash bin/proxy-ctl capabilities
          PA_PROFILE_DIR=/tmp/proxy-agent/profiles bash bin/proxy-agent-profile list
          PA_CONFIG=/tmp/proxy-agent/proxy-agent.conf bash bin/proxy-ctl env
          PA_CONFIG=/tmp/proxy-agent/proxy-agent.conf bash bin/proxy-ctl status --json
          PA_CONFIG=/tmp/proxy-agent/proxy-agent.conf bash bin/proxy-ctl status --json=v2
          PA_CONFIG=/tmp/proxy-agent/proxy-agent.conf bash bin/proxy-ctl health-history --limit 1
          ! PA_CONFIG=/tmp/proxy-agent/proxy-agent.conf bash bin/proxy-ctl doctor
      - name: Rootless installer smoke
        run: bash tests/rootless-smoke.sh

  real-backends:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: sing-box
            version: 1.13.19
            archive: sing-box-1.13.19-linux-amd64.tar.gz
            url: https://github.com/SagerNet/sing-box/releases/download/v1.13.19/sing-box-1.13.19-linux-amd64.tar.gz
          - backend: mihomo
            version: 1.19.30
            archive: mihomo-linux-amd64-v1-v1.19.30.gz
            url: https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-linux-amd64-v1-v1.19.30.gz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends curl ca-certificates iproute2 gzip tar
      - name: Download pinned backend
        env:
          BACKEND_URL: ${{ matrix.url }}
          BACKEND_ARCHIVE: ${{ matrix.archive }}
        run: |
          mkdir -p "$RUNNER_TEMP/proxy-agent-real/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/proxy-agent-real/$BACKEND_ARCHIVE" "$BACKEND_URL"
          case "${{ matrix.backend }}" in
            sing-box)
              tar -xzf "$RUNNER_TEMP/proxy-agent-real/$BACKEND_ARCHIVE" -C "$RUNNER_TEMP/proxy-agent-real/bin"
              mv "$RUNNER_TEMP/proxy-agent-real/bin"/*/sing-box "$RUNNER_TEMP/proxy-agent-real/bin/sing-box"
              ;;
            mihomo)
              gzip -dc "$RUNNER_TEMP/proxy-agent-real/$BACKEND_ARCHIVE" >"$RUNNER_TEMP/proxy-agent-real/bin/mihomo"
              ;;
          esac
          chmod +x "$RUNNER_TEMP/proxy-agent-real/bin/${{ matrix.backend }}"
      - name: Run real binary backend smoke
        run: bash tests/real-backend-smoke.sh "${{ matrix.backend }}" "$RUNNER_TEMP/proxy-agent-real/bin/${{ matrix.backend }}"

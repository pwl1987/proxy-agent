name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './bin ./lib ./backends ./adapters ./integrations ./tests'
      - name: ShellCheck installers
        run: shellcheck install.sh install-user.sh upgrade.sh upgrade-user.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize executable permissions
        run: |
          chmod 0755 bin/* install.sh install-user.sh upgrade.sh upgrade-user.sh integrations/*.sh backends/*.sh adapters/*.sh lib/*.sh tests/*.sh
      - name: Syntax check
        run: |
          find bin lib backends adapters integrations tests -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          bash -n install.sh
          bash -n install-user.sh
          bash -n upgrade.sh
          bash -n upgrade-user.sh
          python3 -m py_compile lib/legacy-typed-export.py lib/typed-legacy-export.py bin/proxy-agent-api bin/proxy-agent-api-auth bin/proxy-agent-reconcile bin/proxy-agent-web bin/proxy-agent-web-ui
          node --check web/config-form.js
          node --check web/profile-selector.js
          node --check web/config-form-sync.js
      - name: Typed config smoke
        run: bash tests/typed-config-smoke.sh
      - name: Legacy to typed config smoke
        run: bash tests/legacy-typed-config-smoke.sh
      - name: Typed config CLI smoke
        run: bash tests/typed-config-cli-smoke.sh
      - name: Direct egress path foundation smoke
        run: bash tests/egress-path-foundation-smoke.sh
      - name: Backend capability manifest smoke
        run: bash tests/backend-capability-manifest-smoke.sh
      - name: Profile context smoke
        run: bash tests/profile-context-smoke.sh
      - name: Route matcher smoke
        run: bash tests/route-matcher-smoke.sh
      - name: Control plane schema smoke
        run: bash tests/control-plane-schema-smoke.sh
      - name: Control API smoke
        run: bash tests/control-api-smoke.sh
      - name: Control API validation smoke
        run: bash tests/control-api-validation-smoke.sh
      - name: Control API error-path smoke
        run: bash tests/control-api-errors-smoke.sh
      - name: Agent Environment smoke
        run: bash tests/agent-environment-smoke.sh
      - name: Revision store smoke
        run: bash tests/revision-store-smoke.sh
      - name: Audit lock smoke
        run: bash tests/audit-lock-smoke.sh
      - name: Reconciler smoke
        run: bash tests/reconciler-smoke.sh
      - name: Reconciler pin smoke
        run: bash tests/reconcile-pin-smoke.sh
      - name: Health recovery smoke
        run: bash tests/health-recovery-smoke.sh
      - name: Path health smoke
        run: bash tests/path-health-smoke.sh
      - name: CLI exec smoke
        run: bash tests/cli-exec-smoke.sh
      - name: Backend contract smoke
        run: bash tests/backend-contract-smoke.sh
      - name: HTTP CONNECT smoke
        run: bash tests/http-connect-smoke.sh
      - name: Upgrade entrypoint guard smoke
        run: |
          if ./upgrade.sh >/dev/null 2>&1; then exit 1; fi
          if [[ "$EUID" -ne 0 ]]; then
            if ./upgrade-user.sh >/dev/null 2>&1; then exit 1; fi
          fi
      - name: Container contract smoke
        run: |
          test -f Containerfile
          grep -q '^FROM debian:bookworm-slim$' Containerfile
          grep -q '^ENTRYPOINT \["/opt/proxy-agent/bin/proxy-ctl"\]$' Containerfile
          grep -q '^CMD \["run"\]$' Containerfile
          grep -q '^USER \$SERVICE_USER$' Containerfile
          grep -q '^HEALTHCHECK ' Containerfile
      - name: systemd unit contract smoke
        run: bash tests/systemd-contract-smoke.sh
      - name: Web gateway smoke
        run: bash tests/web-gateway-smoke.sh
      - name: Web auth audit smoke
        run: bash tests/web-auth-audit-smoke.sh
      - name: Web UI smoke
        run: bash tests/web-ui-smoke.sh
      - name: Functional smoke suite
        run: bash tests/smoke.sh
      - name: TUI guard smoke
        run: bash tests/tui-guard-smoke.sh
      - name: Chinese localization smoke
        run: bash tests/chinese-localization-smoke.sh
      - name: CLI policy smoke
        run: bash tests/cli-policy-smoke.sh
      - name: Rootless installer smoke
        run: bash tests/rootless-smoke.sh

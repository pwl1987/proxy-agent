name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag matches VERSION
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$tag" == "$version" ]] || {
            echo "tag $tag does not match VERSION $version" >&2
            exit 1
          }
          find bin lib backends adapters integrations tests -type f -name '*.sh' -print0 \
            | xargs -0 -r bash -n
          bash -n install.sh install-user.sh upgrade.sh upgrade-user.sh

      - name: Build container image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker build --pull -f Containerfile -t "$IMAGE_NAME:$VERSION" -t "$IMAGE_NAME:latest" .
          docker image inspect "$IMAGE_NAME:$VERSION" >/dev/null

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push container image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_NAME:$VERSION"
          docker push "$IMAGE_NAME:latest"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_NAME:$VERSION")"
          printf '%s\n' "$digest" | tee container-digest.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --verify-tag \
            --generate-notes \
            --title "proxy-agent $VERSION" \
            container-digest.txt
